<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duyệt Phân Loại - Danh Mục Cá Biển Việt Nam</title>
    <link rel="stylesheet" href="assets/shared.css">
    <style>
        .taxonomy-container {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            margin-top: 2rem;
        }

        .tree-level {
            margin-left: 1.5rem;
            border-left: 1px solid rgba(255,255,255,0.05);
            padding-left: 1rem;
            display: none;
        }
        
        .tree-level.expanded {
            display: block;
        }

        .tree-node {
            margin: 0.5rem 0;
        }

        .node-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition-fast);
            border: 1px solid transparent;
        }

        .node-header:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--glass-border);
        }

        .node-toggle {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-normal);
        }
        
        .node-toggle.expanded {
            transform: rotate(90deg);
        }

        .rank-badge {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            letter-spacing: 0.05em;
        }
        .rank-order { background: rgba(88, 101, 242, 0.2); color: #a5b4fc; }
        .rank-family { background: rgba(52, 211, 153, 0.2); color: #6ee7b7; }
        .rank-genus { background: rgba(251, 191, 36, 0.2); color: #fcd34d; }
        .rank-class { background: rgba(167, 139, 250, 0.2); color: #c4b5fd; font-size: 0.75rem; }

        .species-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            margin: 0.25rem 0;
            background: rgba(255,255,255,0.01);
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-primary);
            border: 1px solid rgba(255,255,255,0.03);
            transition: var(--transition-fast);
        }

        .species-item:hover {
            background: rgba(255,255,255,0.05);
            border-color: var(--brand-primary);
            transform: translateX(5px);
        }
        
        .sp-name { font-weight: 600; }
        .sp-sci { color: var(--text-secondary); font-size: 0.9em; font-style: italic; margin-left: 0.5rem; }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.9">
                  <path d="M6.5 12c0-3.5 2.5-6 5.5-6 4 0 7 2.5 7 6s-3 6-7 6c-3 0-5.5-2.5-5.5-6z"/>
                  <path d="M2 9c1 1 2 2 2 3s-1 2-2 3"/>
                  <circle cx="16" cy="10" r="1" fill="currentColor"/>
                </svg>
                <span class="logo-text">DANH MỤC CÁ BIỂN VIỆT NAM</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Trang Chủ</a>
                <a href="browse.html" class="nav-link active">Duyệt Theo Loài</a>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div style="margin-bottom: 2rem;">
            <h1>Hệ thống phân loại khoa học</h1>
            <p style="color: var(--text-secondary)">Duyệt cây phân loại từ Bộ, Họ, Giống đến Loài.</p>
        </div>

        <div class="search-input-container" style="max-width: 500px; margin-bottom: 2rem;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="treeFilter" class="search-input" placeholder="Lọc nhánh (Ví dụ: Cá Vược)..." autocomplete="off">
        </div>

        <div class="taxonomy-container" id="treeContainer">
            <div id="loadingState" style="text-align: center; padding: 4rem; color: #64748b;">
            Đang tải dữ liệu phân loại...
        </div>
    </main>

    <footer style="text-align: center; padding: 2rem; margin-top: 4rem; border-top: 1px solid rgba(255,255,255,0.05); color: #64748b; font-size: 0.9rem;">
        <p>Chuyển đổi số phục vụ công tác nghiên cứu khoa học. Đơn vị thực hiện: Phòng Thông tin - Truyền thông, Viện Hải dương học</p>
        <p style="margin-top: 0.5rem;">Phiên bản: 1.0.0</p>
    </footer>

    <script>
        // Create SVG arrow
        const arrowSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>`;

        function createNode(title, rankClass, rankName, childrenHTML) {
            return `
                <div class="tree-node" data-search="${title.toLowerCase()}">
                    <div class="node-header" onclick="toggleNode(this)">
                        <div class="node-toggle">${arrowSvg}</div>
                        <span class="rank-badge ${rankClass}">${rankName}</span>
                        <span>${title}</span>
                    </div>
                    <div class="tree-level">
                        ${childrenHTML}
                    </div>
                </div>
            `;
        }

        function renderTree(data) {
            let html = '';
            
            // data is an array of classes
            data.forEach(cls => {
                let classHTML = '';
                
                cls.children.forEach(order => {
                    let orderHTML = '';
                    
                    order.children.forEach(family => {
                        let familyHTML = '';
                        
                        family.children.forEach(genus => {
                            let speciesHTML = '';
                            if (genus.species) {
                                genus.species.forEach(sp => {
                                    speciesHTML += `
                                        <a href="species.html?id=${sp.id}" class="species-item" data-search="${sp.vnName.toLowerCase()} ${sp.scientificName.toLowerCase()}">
                                            <div>
                                                <span class="sp-name">${sp.vnName}</span>
                                                <span class="sp-sci">${sp.scientificName}</span>
                                            </div>
                                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                                        </a>
                                    `;
                                });
                            }
                            
                            const genusName = genus.latin && genus.latin.trim() ? `${genus.vn} (${genus.latin})` : genus.vn;
                            familyHTML += createNode(genusName, 'rank-genus', 'Giống', speciesHTML);
                        });
                        
                        const familyName = family.latin && family.latin.trim() && family.latin !== 'Family' ? `${family.vn} (${family.latin})` : family.vn;
                        orderHTML += createNode(familyName, 'rank-family', 'Họ', familyHTML);
                    });
                    
                    const orderName = order.latin && order.latin.trim() && order.latin !== 'Order' ? `${order.vn} (${order.latin})` : order.vn;
                    classHTML += createNode(orderName, 'rank-order', 'Bộ', orderHTML);
                });
                
                const clsName = cls.latin && cls.latin.trim() ? `${cls.vn} (${cls.latin})` : cls.vn;
                html += createNode(clsName, 'rank-class', 'Lớp', classHTML);
            });
            
            return html;
        }

        fetch('data/taxonomy_tree.json')
            .then(r => r.json())
            .then(data => {
                document.getElementById('treeContainer').innerHTML = renderTree(data);
            });

        function toggleNode(headerEl) {
            const toggle = headerEl.querySelector('.node-toggle');
            const level = headerEl.nextElementSibling;
            
            toggle.classList.toggle('expanded');
            level.classList.toggle('expanded');
        }

        // Simple filter
        document.getElementById('treeFilter').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            const nodes = document.querySelectorAll('#treeContainer .tree-node, #treeContainer .species-item');
            
            if (!query) {
                nodes.forEach(n => n.style.display = '');
                return;
            }

            nodes.forEach(n => {
                const searchTxt = n.getAttribute('data-search') || '';
                if (searchTxt.includes(query)) {
                    n.style.display = '';
                    // expand parents
                    let parent = n.parentElement.closest('.tree-node');
                    while(parent) {
                        parent.style.display = '';
                        parent.querySelector('.node-toggle').classList.add('expanded');
                        parent.querySelector('.tree-level').classList.add('expanded');
                        parent = parent.parentElement.closest('.tree-node');
                    }
                } else {
                    n.style.display = 'none';
                }
            });
        });
    </script>
<script src="assets/shared.js"></script></body>
</html>
