<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Loài - Danh Mục Cá Biển Việt Nam</title>
    <link rel="stylesheet" href="assets/shared.css">
    <style>
        .species-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            margin-top: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* Volume accent bar — left edge */
        .species-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--vol-color, var(--brand-primary));
            border-radius: 12px 0 0 12px;
        }

        /* Volume color tokens */
        .vol-1 { --vol-color: #818cf8; --vol-color-rgb: 129,140,248; }
        .vol-2 { --vol-color: #34d399; --vol-color-rgb: 52,211,153; }
        .vol-3 { --vol-color: #f87171; --vol-color-rgb: 248,113,113; }
        .vol-4 { --vol-color: #fbbf24; --vol-color-rgb: 251,191,36; }
        .vol-5 { --vol-color: #60a5fa; --vol-color-rgb: 96,165,250; }

        /* Highlight row for key fields */
        .info-item-featured {
            background: rgba(var(--vol-color-rgb, 88,101,242), 0.06);
            border-left: 2px solid rgba(var(--vol-color-rgb, 88,101,242), 0.35);
            border-radius: 4px;
            margin-left: -0.5rem;
            padding-left: 0.5rem;
        }

        .sp-header {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sp-title {
            font-size: 2.5rem;
            margin-bottom: 0.25rem;
            color: #ffffff;
            font-weight: 800;
        }

        .sp-sci-title {
            font-size: 1.25rem;
            color: #94a3b8;
            font-style: italic;
        }
        
        .sp-author {
            color: #64748b;
            font-style: normal;
        }

        /* FishBase Status Badge */
        .fishbase-bar {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-top: 1rem;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .fishbase-bar.fb-valid {
            background: rgba(52, 211, 153, 0.08);
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .fishbase-bar.fb-synonym {
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.25);
        }

        .fishbase-bar.fb-not-found, .fishbase-bar.fb-unknown {
            background: rgba(148, 163, 184, 0.06);
            border: 1px solid rgba(148, 163, 184, 0.12);
        }

        .fb-icon {
            font-size: 1.1rem;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .fb-body {}

        .fb-label {
            font-weight: 700;
            margin-bottom: 0.1rem;
        }

        .fb-valid   .fb-label { color: #6ee7b7; }
        .fb-synonym .fb-label { color: #fcd34d; }
        .fb-not-found .fb-label, .fb-unknown .fb-label { color: #94a3b8; }

        .fb-detail {
            color: #64748b;
            font-size: 0.82rem;
        }

        .fb-accepted {
            font-style: italic;
            color: #e2e8f0;
        }

        .fb-link {
            display: inline-block;
            margin-top: 0.25rem;
            color: #5865f2;
            font-size: 0.8rem;
            font-style: normal;
        }
        .fb-link:hover { color: #818cf8; }


        .taxonomy-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
        }

        .tax-badge {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            font-size: 0.85rem;
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            max-width: 100%;
            flex-wrap: wrap;
            word-break: break-word;
        }

        .tax-badge-label {
            color: #94a3b8;
            flex-shrink: 0;
        }

        .tax-badge-value {
            color: #e2e8f0;
            font-weight: 600;
            word-break: break-word;
        }

        .tax-badge-en {
            color: #64748b;
            font-style: italic;
            word-break: break-word;
        }

        .grid-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .species-card { padding: 1.25rem 1rem; }
            .grid-info {
                grid-template-columns: 1fr;
                gap: 0;
            }
            /* Separator visual giữa 2 panel trên mobile */
            .grid-info .info-panel + .info-panel {
                margin-top: 0.75rem;
                border-top: 1px solid rgba(255,255,255,0.06);
            }
            .sp-header { margin-bottom: 1rem; padding-bottom: 1rem; }
        }

        @media (max-width: 480px) {
            .species-card { padding: 1rem 0.875rem; }
        }

        .info-panel {
            background: rgba(15, 20, 30, 0.4);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .panel-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-weight: 700;
        }

        .panel-badge {
            background: rgba(255,255,255,0.05);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.7rem;
            color: #94a3b8;
        }

        .info-item {
            margin-bottom: 1.25rem;
        }
        
        .info-item:last-child {
            margin-bottom: 0;
        }

        .info-label {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 0.25rem;
        }

        .info-value {
            font-size: 1.05rem;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .synonym-panel {
            background: rgba(15, 20, 30, 0.4);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .synonym-content {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.8;
            white-space: pre-line;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            color: #94a3b8;
            font-weight: 500;
        }
        
        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M12 8v4l3 3"/></svg>
                <span class="logo-full">DANH MỤC CÁ BIỂN VIỆT NAM</span><span class="logo-short">CÁ BIỂN VN</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Trang Chủ</a>
                <a href="browse.html" class="nav-link">Duyệt Theo Loài</a>
            </div>
        </div>
    </header>

    <main class="main-container">
        <a href="javascript:history.back()" class="back-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Quay lại
        </a>
        
        <div id="speciesDetail" class="species-card" style="display: none;">
            <!-- Rendered by JS -->
        </div>
        
        <div id="loadingState" style="text-align: center; padding: 4rem; color: #64748b;">
            Đang tải dữ liệu loài cá...
        </div>
        <div id="errorState" style="display:none; text-align: center; padding: 4rem; color: #f87171;">
            Không tìm thấy thông tin loài cá này.
        </div>
    </main>

    <footer style="text-align: center; padding: 2rem; margin-top: 4rem; border-top: 1px solid rgba(255,255,255,0.05); color: #64748b; font-size: 0.9rem;">
        <p>Chuyển đổi số phục vụ công tác nghiên cứu khoa học. Đơn vị thực hiện: Phòng Thông tin - Truyền thông, Viện Hải dương học</p>
        <p style="margin-top: 0.5rem;">Phiên bản: 1.0.0</p>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const speciesId = urlParams.get('id');

        if (!speciesId) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
        } else {
            Promise.allSettled([
                fetch('data/species.json').then(r => r.json()),
                fetch('data/fishbase_sync.json').then(r => r.json())
            ]).then(([spResult, fbResult]) => {
                document.getElementById('loadingState').style.display = 'none';

                if (spResult.status !== 'fulfilled') {
                    document.getElementById('errorState').style.display = 'block';
                    return;
                }

                const data   = spResult.value;
                const fbData = fbResult.status === 'fulfilled' ? fbResult.value : {};
                const sp     = data.find(item => item.id === speciesId);

                if (sp) {
                    renderSpecies(sp, fbData[sp.id] || null);
                } else {
                    document.getElementById('errorState').style.display = 'block';
                }
            });
        }

        function buildFishbaseBadge(fb) {
            if (!fb) return '';

            const statusMap = {
                valid:       { cls: 'fb-valid',     icon: '✅', label: 'Tên hợp lệ trên WoRMS' },
                synonym:     { cls: 'fb-synonym',   icon: '🔄', label: 'Tên cũ — đã được cập nhật' },
                uncertain:   { cls: 'fb-synonym',   icon: '⚠️', label: 'Trạng thái phân loại chưa rõ' },
                not_found:   { cls: 'fb-not-found', icon: '❓', label: 'Chưa xác minh được trên WoRMS' },
                parse_error: { cls: 'fb-unknown',   icon: '⚠️', label: 'Không phân tích được tên khoa học' }
            };

            const s        = statusMap[fb.status] || statusMap['not_found'];
            const syncDate = fb.syncedAt ? fb.syncedAt.substring(0, 10) : '';
            const wormsId  = fb.wormsId;
            const wormsUrl = wormsId ? `https://www.marinespecies.org/aphia.php?p=taxdetails&id=${wormsId}` : null;

            let detail = '';
            if (fb.status === 'valid') {
                detail = `Tên được xác nhận${syncDate ? ` · cập nhật WoRMS: ${fb.lastUpdated || syncDate}` : ''}`;
            } else if (fb.status === 'synonym') {
                detail = `Tên hiện hành: <span class="fb-accepted">${fb.acceptedName || '?'}</span>${fb.lastUpdated ? ` · cập nhật: ${fb.lastUpdated}` : ''}`;
            } else {
                detail = fb.note || 'Chưa xác minh được trên WoRMS';
            }

            const linkHtml = wormsUrl
                ? `<a href="${wormsUrl}" class="fb-link" target="_blank" rel="noopener">→ Xem trên WoRMS (marinespecies.org)</a>`
                : '';

            return `
            <div class="fishbase-bar ${s.cls}">
                <span class="fb-icon">${s.icon}</span>
                <div class="fb-body">
                    <div class="fb-label">WoRMS — ${s.label}</div>
                    <div class="fb-detail">${detail}</div>
                    ${linkHtml}
                </div>
            </div>`;
        }

        function formatOneSynonym(text) {
            if (!text) return '';
            let trimmed = text.trim();
            if (!trimmed) return '';
            // In nghiêng phần Genus species (hoặc Genus (Subgenus) species) ở đầu dòng
            return trimmed.replace(/^([A-Z][a-z\-]+(?: \([A-Z][a-z\-]+\))? [a-z\-]+)(.*)/, '<i>$1</i>$2');
        }

        function formatSynonymsArray(arr) {
            if (!arr || !arr.length) return '';
            return arr.map(s => formatOneSynonym(s)).filter(Boolean).join('<br><br>');
        }

        function renderSpecies(sp, fb = null) {
            const container = document.getElementById('speciesDetail');
            
            const tax = sp.taxonomy || {};
            const vn = (sp.specs && sp.specs.vn) || {};
            const en = (sp.specs && sp.specs.en) || {};
            
            let taxHTML = '';
            if (tax.order && tax.order.vn) {
                taxHTML += `<div class="tax-badge"><span class="tax-badge-label">Bộ:</span> <span class="tax-badge-value">${tax.order.vn.toUpperCase()}</span> <span class="tax-badge-en">(${tax.order.latin || ''})</span></div>`;
            }
            if (tax.family && tax.family.vn) {
                taxHTML += `<div class="tax-badge"><span class="tax-badge-label">Họ:</span> <span class="tax-badge-value">${tax.family.vn.toUpperCase()}</span> <span class="tax-badge-en">(${tax.family.latin || ''})</span></div>`;
            }
            if (tax.genus && tax.genus.vn) {
                taxHTML += `<div class="tax-badge"><span class="tax-badge-label">Giống:</span> <span class="tax-badge-value">${tax.genus.vn}</span> <span class="tax-badge-en">(${tax.genus.latin || ''})</span></div>`;
            }

            const cleanAuthorship = (sp.authorship || '').replace(/"/g, '').trim();

            const volClass = sp.volume ? `vol-${sp.volume}` : '';

            container.innerHTML = `
                <div class="species-card ${volClass}">
                ${sp.image ? `
                <div class="hero-image-container">
                    <img src="${sp.image}" alt="${sp.vnName}" class="hero-image">
                </div>
                ` : ''}

                <div class="sp-header">
                    <h1 class="sp-title">${sp.vnName}</h1>
                    <div class="sp-sci-title">${sp.scientificName} <span class="sp-author">${cleanAuthorship}</span></div>
                    ${buildFishbaseBadge(fb)}
                </div>
                
                <div class="taxonomy-bar">
                    ${taxHTML}
                </div>
                
                <div class="grid-info">
                    <!-- Tiếng Việt Panel -->
                    <div class="info-panel">
                        <div class="panel-title">
                            Thông số tiếng Việt
                            <span class="panel-badge">VN</span>
                        </div>
                        
                        <div class="info-item info-item-featured"><div class="info-label">Tên gọi khác</div><div class="info-value">${vn.alternateNames || vn.synonyms || '—'}</div></div>
                        ${vn.size ? `<div class="info-item"><div class="info-label">Kích thước</div><div class="info-value">${vn.size}</div></div>` : ''}
                        ${vn.distribution ? `<div class="info-item"><div class="info-label">Phân bố</div><div class="info-value">${vn.distribution}</div></div>` : ''}
                        ${vn.specimen ? `<div class="info-item"><div class="info-label">Nơi lưu trữ mẫu</div><div class="info-value">${vn.specimen}</div></div>` : ''}
                        ${vn.status ? `<div class="info-item"><div class="info-label">Tình trạng</div><div class="info-value">${vn.status}</div></div>` : ''}
                        ${vn.literature ? `<div class="info-item"><div class="info-label">Tài liệu dẫn</div><div class="info-value">${vn.literature}</div></div>` : ''}
                    </div>
                    
                    <!-- English Panel -->
                    <div class="info-panel">
                        <div class="panel-title">
                            English Specifications
                            <span class="panel-badge">EN</span>
                        </div>
                        
                        ${(en.alternateNames || en.synonyms) ? `<div class="info-item"><div class="info-label">Alternate Names</div><div class="info-value">${en.alternateNames || en.synonyms}</div></div>` : ''}
                        <div class="info-item info-item-featured"><div class="info-label">Common Name</div><div class="info-value">${en.commonName || en.common_name || '—'}</div></div>
                        ${en.size ? `<div class="info-item"><div class="info-label">Size</div><div class="info-value">${en.size}</div></div>` : ''}
                        ${en.distribution ? `<div class="info-item"><div class="info-label">Distribution</div><div class="info-value">${en.distribution}</div></div>` : ''}
                        ${(en.conservation || en.specimen) ? `<div class="info-item"><div class="info-label">Conservation / Specimen</div><div class="info-value">${en.conservation || en.specimen}</div></div>` : ''}
                        ${en.status ? `<div class="info-item"><div class="info-label">Status</div><div class="info-value">${en.status}</div></div>` : ''}
                        ${en.literature ? `<div class="info-item"><div class="info-label">Literature</div><div class="info-value">${en.literature}</div></div>` : ''}
                    </div>
                </div>
                
                ${(sp.synonyms && sp.synonyms.length > 0) ? `
                <details class="synonym-details">
                    <summary class="synonym-summary">
                        Danh pháp đồng nghĩa (Synonyms) & Phân loại học gốc
                    </summary>
                    <div class="synonym-content-inner">
                        <div class="synonym-content">${formatSynonymsArray(sp.synonyms)}</div>
                    </div>
                </details>
                ` : ''}
                </div>
            `;
            container.style.display = 'block';
            document.title = `${sp.vnName} - Danh Mục Cá Biển Việt Nam`;
        }
    </script>
<script src="assets/shared.js"></script></body>
</html>
